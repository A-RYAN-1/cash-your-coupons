name: Uptime

# Pings the live API and app every 30 minutes. A failed run is the alert
# (GitHub emails the repository owner about failed scheduled workflows).
# Render's free instance still sleeps between pings; the first call may be a cold start.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: API health (allows a cold start)
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 20 https://cash-your-coupons-api.onrender.com/health
      - name: App is served
        run: curl --fail --silent --show-error --max-time 30 --output /dev/null https://cash-your-coupons.vercel.app
